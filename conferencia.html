<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financeiro Fácil — Conferência Mensal</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/conferencia.css"/>
</head>
<body>
<nav>
  <div class="brand">
    <img src="icon.png" style="height:32px;width:32px;object-fit:contain;vertical-align:middle;margin-right:.4rem;border-radius:6px">
    Financeiro <span>Fácil</span>
  </div>
  <a href="index.html">Lançamentos</a>
  <a href="conferencia.html" class="active">Conferência</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="config.html">Configurações</a>
  <span class="nav-version" id="navVersion">v4.0.2</span>
</nav>

<div class="main">

  <!-- Filtros -->
  <div class="filter-row">
    <label>Mês:</label>
    <select id="filtroMes">
      <option value="0">Janeiro</option><option value="1">Fevereiro</option>
      <option value="2">Março</option><option value="3">Abril</option>
      <option value="4">Maio</option><option value="5">Junho</option>
      <option value="6">Julho</option><option value="7">Agosto</option>
      <option value="8">Setembro</option><option value="9">Outubro</option>
      <option value="10">Novembro</option><option value="11">Dezembro</option>
    </select>
    <label>Ano:</label>
    <select id="filtroAno"></select>
  </div>

  <!-- Barra de progresso -->
  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <span class="progress-label" id="progressLabel">0 / 0 confirmados</span>
  </div>

  <!-- Summary pills -->
  <div class="summary-bar" id="summaryBar"></div>

  <!-- Tabela -->
  <div class="table-card">
    <div class="table-header">
      <h2>📋 Conferência Mensal</h2>
      <div class="sort-row">
        <button class="btn btn-ghost" id="btnOrdemValor"  onclick="toggleOrdem('valor')" style="font-size:.82rem;padding:.35rem .9rem">Valor ▼</button>
        <button class="btn btn-ghost" id="btnOrdemVenc"   onclick="toggleOrdem('venc')"  style="font-size:.82rem;padding:.35rem .9rem">Vencimento</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:36px">✓</th>
          <th>Mov.</th>
          <th>Conta / Cartão</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Venc.</th>
          <th style="text-align:right;cursor:pointer" id="thValor">Valor</th>
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
    </table>

    <div id="emptyState" class="empty-state" style="display:none">
      <div class="icon">📋</div>
      <p>Nenhum lançamento encontrado para este período.</p>
    </div>
  </div>
</div>

<!-- Modal confirmação genérico (exigido por ui.js) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Confirmar</h2>
    <p id="modalMsg" style="color:var(--muted);margin-bottom:1.5rem;font-size:.95rem"></p>
    <div style="display:flex;gap:.75rem">
      <button class="btn btn-danger" id="modalConfirm">Confirmar</button>
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="db.js"></script>
<script src="js/auth.js"></script>
<script src="js/db-adapter.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.browser.js"></script>
<script src="js/ui.js"></script>
<script src="js/conferencia.js"></script>
</body>
</html>
