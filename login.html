<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financeiro Fácil — Entrar</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="icon.png" alt="" style="height:48px;width:48px;object-fit:contain;border-radius:10px"/>
    </div>
    <h1>Financeiro Fácil</h1>

    <!-- Abas -->
    <div class="login-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Cadastrar</button>
    </div>

    <!-- LOGIN -->
    <form id="formLogin" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="seu@email.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="loginSenha">Senha</label>
        <input id="loginSenha" type="password" placeholder="••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    </form>

    <!-- CADASTRO -->
    <form id="formRegister" onsubmit="return handleRegister(event)" style="display:none">
      <div class="form-group">
        <label for="regNome">Nome</label>
        <input id="regNome" type="text" placeholder="Seu nome" required autocomplete="name"/>
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" placeholder="seu@email.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="regSenha">Senha</label>
        <input id="regSenha" type="password" placeholder="Mínimo 4 caracteres" required autocomplete="new-password"/>
      </div>
      <div class="form-group">
        <label for="regSenha2">Confirmar senha</label>
        <input id="regSenha2" type="password" placeholder="Repita a senha" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btnRegister">Criar conta</button>
    </form>

    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  // Se já estiver logado, vai direto para lançamentos
  if (getToken()) window.location.href = 'index.html';

  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('formLogin').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('formRegister').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('loginMsg').className = 'login-msg';
  }

  function showMsg(msg, isError) {
    const el = document.getElementById('loginMsg');
    el.textContent = msg;
    el.className = 'login-msg' + (isError ? ' error' : ' success');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = 'Entrando…';
    showMsg('');

    try {
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('loginEmail').value,
          senha:    document.getElementById('loginSenha').value,
        }),
      });
      const data = await resp.json();

      if (!resp.ok) throw new Error(data.error || 'Erro ao entrar');

      setToken(data.token);
      setUser(data.user);
      window.location.href = 'index.html';
    } catch (err) {
      showMsg(err.message, true);
      btn.disabled = false; btn.textContent = 'Entrar';
    }
    return false;
  }

  async function handleRegister(e) {
    e.preventDefault();
    const nome  = document.getElementById('regNome').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const senha = document.getElementById('regSenha').value;
    const senha2= document.getElementById('regSenha2').value;

    if (senha !== senha2) { showMsg('As senhas não coincidem.', true); return false; }

    const btn = document.getElementById('btnRegister');
    btn.disabled = true; btn.textContent = 'Criando…';
    showMsg('');

    try {
      const resp = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, email, senha }),
      });
      const data = await resp.json();

      if (!resp.ok) throw new Error(data.error || 'Erro ao cadastrar');

      setToken(data.token);
      setUser(data.user);
      window.location.href = 'index.html';
    } catch (err) {
      showMsg(err.message, true);
      btn.disabled = false; btn.textContent = 'Criar conta';
    }
    return false;
  }
</script>
</body>
</html>
